[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blind-tokens"
version = "0.1.0"
description = "Zero-Knowledge Context Sanitizer & Token Blinded Encryption for Reasoning Traces"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ahmed Hassan", email = "ahmed@example.com" }
]
keywords = [
    "zero-knowledge",
    "data-privacy",
    "gdpr",
    "hipaa",
    "reasoning-traces",
    "claude-opus-5-5",
    "gpt-6-astra",
    "ai-safety"
]
dependencies = []

[project.scripts]
blind-tokens = "blind_tokens.cli:main"
